# ============================================================
# Quarkus - ms-payments configuration
# ============================================================

# ---- Application ----
quarkus.application.name=ms-payments

# ---- Custom Banner ----
quarkus.banner.enabled=true
quarkus.banner.path=banner.txt

# ---- HTTP ----
quarkus.http.port=3000

# ---- DataSource (PostgreSQL) ----
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=${POSTGRES_USER:postgres}
quarkus.datasource.password=${POSTGRES_PASSWORD:postgres}
quarkus.datasource.jdbc.url=${QUARKUS_DATASOURCE_JDBC_URL:jdbc:postgresql://localhost:5432/payments_db}

# ---- Hibernate ORM ----
quarkus.hibernate-orm.database.generation=none
quarkus.hibernate-orm.log.sql=false

# ---- Flyway migrations ----
quarkus.flyway.migrate-at-start=true
quarkus.flyway.locations=classpath:db/migration

# ---- Kafka Bootstrap ----
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- Schema Registry ----
mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---- SmallRye Reactive Messaging — outgoing (producer) ----
mp.messaging.outgoing.transaction-validation-request.connector=smallrye-kafka
mp.messaging.outgoing.transaction-validation-request.topic=transaction-validation-request
mp.messaging.outgoing.transaction-validation-request.value.serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
mp.messaging.outgoing.transaction-validation-request.key.serializer=org.apache.kafka.common.serialization.StringSerializer

# ---- SmallRye Reactive Messaging — incoming (consumer) ----
mp.messaging.incoming.transaction-validation-response.connector=smallrye-kafka
mp.messaging.incoming.transaction-validation-response.topic=transaction-validation-response
mp.messaging.incoming.transaction-validation-response.group.id=ms-payments-consumer-group
mp.messaging.incoming.transaction-validation-response.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transaction-validation-response.value.deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
mp.messaging.incoming.transaction-validation-response.json.value.type=com.example.payments.infrastructure.adapter.in.messaging.dto.TransactionValidationResponseDto
mp.messaging.incoming.transaction-validation-response.json.fail.unknown.properties=false
mp.messaging.incoming.transaction-validation-response.auto.offset.reset=earliest
mp.messaging.incoming.transaction-validation-response.failure-strategy=ignore
mp.messaging.incoming.transaction-validation-response.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Consumer tuning for Docker environments
mp.messaging.incoming.transaction-validation-response.enable.auto.commit=true
mp.messaging.incoming.transaction-validation-response.auto.commit.interval.ms=1000
mp.messaging.incoming.transaction-validation-response.session.timeout.ms=45000
mp.messaging.incoming.transaction-validation-response.heartbeat.interval.ms=10000
mp.messaging.incoming.transaction-validation-response.max.poll.interval.ms=300000
mp.messaging.incoming.transaction-validation-response.max.poll.records=500
mp.messaging.incoming.transaction-validation-response.fetch.min.bytes=1
mp.messaging.incoming.transaction-validation-response.fetch.max.wait.ms=500
mp.messaging.incoming.transaction-validation-response.connections.max.idle.ms=540000

# ---- Thread Pool Configuration for Kafka ----
# Configure worker threads for blocking message handlers
quarkus.thread-pool.core-threads=10
quarkus.thread-pool.max-threads=20
quarkus.thread-pool.queue-size=128
quarkus.thread-pool.keep-alive-time=60s

# SmallRye Messaging worker configuration
smallrye.messaging.worker.concurrency=4
smallrye.messaging.worker.max-attempts=3

mp.messaging.outgoing.transaction-validation-request.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}


# ---- GraphQL ----
quarkus.smallrye-graphql.ui.enable=true

# ---- Health ----
quarkus.smallrye-health.ui.enable=true

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG

# ============================================================
# Test profile overrides (applied when running tests)
# ============================================================
%test.quarkus.log.level=WARN
%test.quarkus.hibernate-orm.log.sql=false
