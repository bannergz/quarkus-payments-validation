# ============================================================
# Test profile — used during mvn test
# ============================================================

# Use Quarkus Dev Services (Testcontainers) to spin up a real PostgreSQL
quarkus.datasource.db-kind=postgresql

# Dev Services starts Postgres automatically — Flyway will migrate it
quarkus.flyway.migrate-at-start=true

# Use Quarkus Dev Services for Kafka
quarkus.kafka.devservices.enabled=true

# Suppress SQL noise in tests
quarkus.hibernate-orm.log.sql=false
quarkus.log.level=WARN
quarkus.log.category."com.example".level=INFO
