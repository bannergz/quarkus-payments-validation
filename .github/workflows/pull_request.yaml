---
name: Check Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  # ============================================================
  # ms-payments: lint + unit tests
  # ============================================================
  ms-payments-lint:
    name: ms-payments / Checkstyle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-payments
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -q

  ms-payments-unit-tests:
    name: ms-payments / Unit Tests
    runs-on: ubuntu-latest
    needs: ms-payments-lint
    defaults:
      run:
        working-directory: ms-payments
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with coverage
        run: mvn test -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms-payments-coverage
          path: ms-payments/target/site/jacoco/

  # ============================================================
  # ms-frauds: lint + unit tests
  # ============================================================
  ms-frauds-lint:
    name: ms-frauds / Checkstyle
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ms-frauds
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run Checkstyle
        run: mvn checkstyle:check -q

  ms-frauds-unit-tests:
    name: ms-frauds / Unit Tests
    runs-on: ubuntu-latest
    needs: ms-frauds-lint
    defaults:
      run:
        working-directory: ms-frauds
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run unit tests with coverage
        run: mvn test -q

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ms-frauds-coverage
          path: ms-frauds/target/site/jacoco/
