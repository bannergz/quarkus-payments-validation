# ============================================================
# Quarkus - ms-frauds configuration
# ============================================================

# ---- Application ----
quarkus.application.name=ms-frauds

# ---- Custom Banner ----
quarkus.banner.enabled=true
quarkus.banner.path=banner.txt

# ---- HTTP ----
quarkus.http.port=8080

# ---- Kafka Bootstrap ----
kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

# ---- Schema Registry ----
mp.messaging.connector.smallrye-kafka.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}

# ---- SmallRye Reactive Messaging — incoming (consumer) ----
mp.messaging.incoming.transaction-validation-request.connector=smallrye-kafka
mp.messaging.incoming.transaction-validation-request.topic=transaction-validation-request
mp.messaging.incoming.transaction-validation-request.group.id=ms-frauds-consumer-group
mp.messaging.incoming.transaction-validation-request.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.transaction-validation-request.value.deserializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaDeserializer
mp.messaging.incoming.transaction-validation-request.json.value.type=com.example.frauds.infrastructure.adapter.in.messaging.dto.TransactionValidationRequestDto
mp.messaging.incoming.transaction-validation-request.json.fail.unknown.properties=false
mp.messaging.incoming.transaction-validation-request.auto.offset.reset=earliest
mp.messaging.incoming.transaction-validation-request.failure-strategy=ignore

# ---- SmallRye Reactive Messaging — outgoing (producer) ----
mp.messaging.outgoing.transaction-validation-response.connector=smallrye-kafka
mp.messaging.outgoing.transaction-validation-response.topic=transaction-validation-response
mp.messaging.outgoing.transaction-validation-response.value.serializer=io.confluent.kafka.serializers.json.KafkaJsonSchemaSerializer
mp.messaging.outgoing.transaction-validation-response.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.transaction-validation-response.http.connect.timeout.ms=5000
mp.messaging.outgoing.transaction-validation-response.http.read.timeout.ms=10000

# ---- Health ----
quarkus.smallrye-health.ui.enable=true

# ---- Logging ----
quarkus.log.level=INFO
quarkus.log.category."com.example".level=DEBUG
quarkus.log.category."io.smallrye.reactive.messaging.kafka".level=DEBUG
quarkus.log.category."org.apache.kafka.clients".level=WARN

# ============================================================
# Test profile overrides
# ============================================================
%test.quarkus.log.level=WARN
%test.quarkus.kafka.devservices.enabled=true
