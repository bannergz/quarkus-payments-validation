services:
  # ==================== Services ====================
  ms-payments:
    image: ms-payments:latest
    build:
      context: ./ms-payments
      dockerfile: Dockerfile
    container_name: ms-payments
    restart: unless-stopped
    ports:
      - "3000:8080"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://postgres:5432/payments_db
      QUARKUS_DATASOURCE_USERNAME: postgres
      QUARKUS_DATASOURCE_PASSWORD: postgres
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - payments-network

  ms-frauds:
    image: ms-frauds:latest
    build:
      context: ./ms-frauds
      dockerfile: Dockerfile
    container_name: ms-frauds
    restart: unless-stopped
    ports:
      - "3001:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/q/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - payments-network

networks:
  payments-network:
    external: true
